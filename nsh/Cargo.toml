[package]
name = "recurrency-nsh"
version = "0.56.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.6.1"
nsh-base = "0.6.1"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rust_decimal = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4", "js"] }
qrcode = { version = "0.14", default-features = false }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.6.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "websocket", "updater", "svg", "net", "sound"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "websocket", "updater", "svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "websocket", "updater", "svg", "net"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "DataTransfer", "Document", "DragEvent", "Element", "Event", "EventTarget", "File", "FileList", "FileReader", "HtmlAnchorElement", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "Location", "NodeList", "PointerEvent", "PointerEventInit", "Storage", "Url", "Window"] }

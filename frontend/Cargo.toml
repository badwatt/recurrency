[package]
name = "recurrency-ui"
version = "0.12.0"
edition = "2021"
description = "Recurrency - Subscription tracker (Dioxus frontend)"

[lib]
name = "recurrency"
crate-type = ["cdylib", "rlib"]
path = "src/main.rs"

[[bin]]
name = "recurrency-ui"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.5", features = ["router"] }
web-sys = { version = "0.3.95", optional = true, features = ["Window", "Document", "Element", "HtmlDialogElement", "HtmlElement", "MediaQueryList", "MediaQueryListEvent", "Storage"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
chrono = { version = "0.4.44", features = ["serde"] }
rust_decimal = { version = "1.41.0", features = ["serde"] }
rust_decimal_macros = "1.40.0"
uuid = { version = "1.23.0", features = ["v4", "serde", "js"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
log = "0.4.27"
gloo-timers = { version = "0.4.0", features = ["futures"] }

[features]
default = ["web"]
web = ["dioxus/web", "web-sys"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server"]

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
opt-level = 2
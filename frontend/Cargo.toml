[package]
name = "recurrency-frontend"
version.workspace = true
edition.workspace = true
description = "Recurrency - Subscription tracker (Dioxus frontend)"

[lib]
name = "recurrency_frontend"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
web-sys = { version = "0.3.95", optional = true, features = ["Window", "Document", "Element", "HtmlDialogElement", "HtmlElement", "MediaQueryList", "MediaQueryListEvent", "Storage", "Navigator"] }
lucide-dioxus = { version = "2.577.0", default-features = false, features = [
    "accessibility",
    "account",
    "arrows",
    "buildings",
    "charts",
    "connectivity",
    "development",
    "devices",
    "files",
    "finance",
    "food-beverage",
    "gaming",
    "home",
    "mail",
    "math",
    "medical",
    "multimedia",
    "nature",
    "navigation",
    "notifications",
    "people",
    "photography",
    "science",
    "security",
    "shopping",
    "sustainability",
    "text",
    "transportation",
    "travel",
    "weather",
] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
chrono.workspace = true
rust_decimal.workspace = true
rust_decimal_macros = "1.40.0"
uuid = { workspace = true, features = ["v4", "serde", "js"] }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls"] }
log = "0.4.27"
gloo-timers = { version = "0.4.0", features = ["futures"], optional = true }
tokio = { version = "1", features = ["time"] }  # always needed for native builds

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "tls", "gzip"] }
dirs = "6.0.0"

[features]
default = ["web"]
web = ["dioxus/web", "web-sys", "gloo-timers"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server"]




[package]
name = "recurrency-ui"
version = "0.11.0"
edition = "2021"
description = "Recurrency - Subscription tracker (Dioxus frontend)"

[dependencies]
dioxus = { version = "0.7.5", features = ["fullstack", "router"] }
web-sys = { version = "0.3.95", optional = true, features = ["Window", "Document", "Element", "HtmlDialogElement", "HtmlElement", "MediaQueryList", "MediaQueryListEvent", "Storage"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
chrono = { version = "0.4.44", features = ["serde"] }
rust_decimal = { version = "1.41.0", features = ["serde"] }
rust_decimal_macros = "1.40.0"
uuid = { version = "1.23.0", features = ["v4", "serde", "js"] }
reqwest = { version = "0.13.2", features = ["json"] }
log = "0.4.27"
gloo-timers = { version = "0.4.0", features = ["futures"] }

[features]
default = ["web"]
web = ["dioxus/web", "web-sys"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server"]
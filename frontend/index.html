<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Recurrency — subscription & expense tracker that helps you budget by viewing every cost as an ongoing commitment." />
  <meta property="og:title" content="Recurrency" />
  <meta property="og:description" content="Subscription & expense tracker. Treat every expense like a subscription." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="theme-color" content="#FAF9F2" />
  <style>
    /* Critical FOUC-prevention: hide body until Tailwind loads */
    body { visibility: hidden; }
    #pre-wasm-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif; }
    ._loader-ring { width: 48px; height: 48px; position: relative; }
    .loader-ring track { position: absolute; inset: 0; border-radius: 50%; border: 2px solid #e5e7eb; }
    html.dark .loader-ring track, html.mocha .loader-ring track { border-color: #374151; }
    .loader-ring arc { position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; border-top-color: #6366f1; animation: loader-spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .loader-ring arc:nth-child(3) { inset: 6px; border-top-color: #818cf8; animation-duration: 1.4s; animation-direction: reverse; }
    @keyframes loader-spin { to { transform: rotate(360deg); } }
    .loader-brand { margin-top: 24px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: #111827; }
    html.dark .loader-brand, html.mocha .loader-brand { color: #f9fafb; }
    .loader-tagline { margin-top: 6px; font-size: 13px; color: #9ca3af; }
    .loader-dots { display: inline-block; }
    .loader-dots span { animation: loader-dot 1.2s infinite; opacity: 0; }
    .loader-dots span:nth-child(1) { animation-delay: 0s; }
    .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes loader-dot { 0%, 60%, 100% { opacity: 0; } 30% { opacity: 1; } }
  </style>
  <noscript><style>body{visibility:visible!important}</style></noscript>
  <title>Recurrency</title>
</head>

<body class="hidden"><!-- hidden until theme applied -->
  <div id="pre-wasm-loader">
    <div class="_loader-ring loader-ring">
      <track></track>
      <arc></arc>
      <arc></arc>
    </div>
    <div class="loader-brand">Recurrency</div>
    <div class="loader-tagline">Every expense is a subscription<span class="loader-dots"><span>.</span><span>.</span><span>.</span></span></div>
  </div>
  <div id="main"></div>
  <script>
    // Set loader background immediately after body exists.
    // This runs synchronously before any rendering, so inline style
    // overrides the CSS default (no cascade delay).
    (function () {
      try {
        var stored = localStorage.getItem('recurrency-theme');
        var theme = stored || 'system';
        var cls = 'light';
        if (theme === 'dark') cls = 'dark';
        else if (theme === 'mocha') cls = 'mocha';
        else if (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) cls = 'dark';
        // Add theme class to html
        if (cls === 'dark') document.documentElement.classList.add('dark');
        else if (cls === 'mocha') document.documentElement.classList.add('mocha');
        else document.documentElement.classList.add('light');
        window.__recurrency_theme = cls;
        // Set loader bg via inline style (authoritative, no cascade)
        // Body stays hidden — Dioxus shows it after rendering with CSS
        // Hide pre-WASM loader once Dioxus renders (uses rAF polling)
        (function() {
            function hideLoader() {
                var loader = document.getElementById('pre-wasm-loader');
                var main = document.getElementById('main');
                if (loader && (main.children.length > 0 || loader.style.display === 'none')) {
                    loader.style.display = 'none';
                    return;
                }
                requestAnimationFrame(hideLoader);
            }
            requestAnimationFrame(hideLoader);
        })();
        // Update meta theme-color
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.content = cls === 'dark' ? '#0d0d11' : cls === 'mocha' ? '#1e1e2e' : '#FAF9F2';
        }
      } catch (e) { }
    })();
  </script>
</body>

</html>

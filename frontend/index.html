<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/recurrency.svg" />
    <title>Recurrency</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('recurrency-theme');
          var theme = stored || 'system';
          var root = document.documentElement;
          root.classList.remove('light', 'dark', 'mocha');
          var resolved;
          if (theme === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            resolved = theme;
          }
          root.classList.add(resolved);
          // Update theme-color meta to match
          var colors = { light: '#ffffff', dark: '#030712', mocha: '#252536' };
          var metas = document.querySelectorAll('meta[name=theme-color]');
          metas.forEach(function(m) { m.setAttribute('content', colors[resolved] || '#ffffff'); });
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

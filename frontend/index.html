<!DOCTYPE html>
<html lang="en" class="dark mocha">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Recurrency — subscription & expense tracker that helps you budget by viewing every cost as an ongoing commitment." />
  <meta property="og:title" content="Recurrency" />
  <meta property="og:description" content="Subscription & expense tracker. Treat every expense like a subscription." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="theme-color" content="#1e1e2e" />
  <style>
    /* Critical pre-WASM styles. Keep this tiny and self-contained: it must
       paint correctly before Tailwind or the WASM bundle exists. */
    html { background-color: #1e1e2e; color: #cdd6f4; }
    html.light { background-color: #FAF9F2; color: #212121; }
    html.dark { background-color: #0d0d11; color: #ededed; }
    html.mocha { background-color: #1e1e2e; color: #cdd6f4; }
    body { margin: 0; background-color: inherit; color: inherit; }
    #main { visibility: hidden; }

    .recurrency-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: inherit;
      color: inherit;
      font-family: 'Cabinet Grotesk', system-ui, -apple-system, sans-serif;
    }
    .recurrency-spinner {
      position: relative;
      width: 48px;
      height: 48px;
    }
    .recurrency-spinner::before,
    .recurrency-spinner::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 3px solid rgba(205, 214, 244, 0.16);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: recurrency-spin 0.9s linear infinite;
    }
    .recurrency-spinner::after {
      inset: 7px;
      border-top-color: transparent;
      border-bottom-color: #818cf8;
      animation-duration: 1.4s;
      animation-direction: reverse;
    }
    html.light .recurrency-spinner::before,
    html.light .recurrency-spinner::after {
      border-color: rgba(33, 33, 33, 0.14);
      border-top-color: #6366f1;
    }
    html.light .recurrency-spinner::after {
      border-top-color: transparent;
      border-bottom-color: #818cf8;
    }
    .recurrency-brand {
      margin-top: 24px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .recurrency-tagline {
      margin-top: 6px;
      font-size: 13px;
      opacity: 0.7;
    }
    .recurrency-dots span {
      animation: recurrency-dot 1.2s infinite;
      opacity: 0;
    }
    .recurrency-dots span:nth-child(2) { animation-delay: 0.2s; }
    .recurrency-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes recurrency-spin { to { transform: rotate(360deg); } }
    @keyframes recurrency-dot {
      0%, 60%, 100% { opacity: 0; }
      30% { opacity: 1; }
    }
  </style>
  <noscript><style>#recurrency-loader{display:none}#main{visibility:visible}</style></noscript>
  <!-- Same clock favicon during loading and after the WASM bundle mounts. -->

  <script>
    // Set theme class on <html> — prevents flash of wrong theme.
    // Mocha is default. Always add 'dark' for Tailwind dark: utilities.
    (function () {
      try {
        var stored = localStorage.getItem('recurrency-theme');
        var theme = stored || 'mocha';
        var cls = 'mocha';
        if (theme === 'dark') cls = 'dark';
        else if (theme === 'light') cls = 'light';
        else if (theme === 'mocha') cls = 'mocha';
        else if (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) cls = 'mocha';
        else if (theme === 'system') cls = 'light';
        var extra = cls === 'light' ? '' : ' dark';
        document.documentElement.className = cls + extra;
        var colors = { light: '#FAF9F2', dark: '#0d0d11', mocha: '#1e1e2e' };
        var color = colors[cls] || colors.mocha;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = color;
        // Android: paint status/navigation bars + icon contrast from the theme.
        try {
          if (window.RecurrencyAndroid && window.RecurrencyAndroid.setSystemBars) {
            window.RecurrencyAndroid.setSystemBars(color, cls === 'light');
          }
        } catch (err) { }
      } catch (e) { }
    })();
  </script>
  <script>
    // Safety net: never leave a blank screen if the WASM bundle cannot start.
    setTimeout(function () {
      var loader = document.getElementById('recurrency-loader');
      if (loader) loader.remove();
      var main = document.getElementById('main');
      if (main) main.style.visibility = 'visible';
    }, 6000);
  </script>
  <title></title>
</head>

<body>
  <div id="recurrency-loader" class="recurrency-loader" role="status" aria-live="polite">
    <div class="recurrency-spinner" aria-hidden="true"></div>
    <div class="recurrency-brand">Recurrency</div>
    <div class="recurrency-tagline">Every expense is a subscription<span class="recurrency-dots"><span>.</span><span>.</span><span>.</span></span></div>
  </div>
  <div id="main"></div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Recurrency</title>
    <style>
        /* Inline theme variables — MUST be before <link> to ensure
           body{background-color:hsl(var(--background))} in tailwind.css
           has defined variables at parse time. */
        :root {
            --background: 0 0% 100%;
            --foreground: 222.2 84% 4.9%;
            --primary: 222.2 47.4% 11.2%;
            --muted: 210 40% 96.1%;
        }
        .dark {
            --background: 222.2 84% 4.9%;
            --foreground: 210 40% 98%;
            --primary: 210 40% 98%;
            --muted: 217.2 32.6% 17.5%;
        }
        .mocha {
            --background: 240 21% 15%;
            --foreground: 226 64% 88%;
            --primary: 232 97% 85%;
            --muted: 234 13% 31%;
        }
        /* Pre-WASM loading overlay — themed + backdrop-blur */
        #pre-wasm-loader {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: fixed; inset: 0; z-index: 9999;
            /* Semi-transparent — app behind visible through blur */
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #fff;
        }
        #pre-wasm-loader .rings { position: relative; width: 3rem; height: 3rem; }
        #pre-wasm-loader .r1,
        #pre-wasm-loader .r2 { position: absolute; inset: 0; border-radius: 9999px; border: 4px solid hsl(var(--muted)); }
        #pre-wasm-loader .r1 { border-top-color: hsl(var(--primary)); animation: spin 1s linear infinite; }
        #pre-wasm-loader .r2 { inset: 0.5rem; border-bottom-color: hsl(var(--primary)/.5); animation: spin 1s linear infinite reverse; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #pre-wasm-loader p { font-size: 0.875rem; font-weight: 500; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.5 } }
    </style>
    <link rel="stylesheet" href="/tailwind.css" />

</head>
<body>
    <div id="pre-wasm-loader">
        <div class="rings"><div class="r1"></div><div class="r2"></div></div>
        <p>Loading...</p>
    </div>
    <div id="main"></div>
    <script>
        // Set loader background immediately after body exists.
        // This runs synchronously before any rendering, so inline style
        // overrides the CSS default (no cascade delay).
        (function() {
            try {
                var stored = localStorage.getItem('recurrency-theme');
                var theme = stored || 'system';
                var cls = 'light';
                if (theme === 'dark') cls = 'dark';
                else if (theme === 'mocha') cls = 'mocha';
                else if (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) cls = 'dark';
                // Add theme class to html
                if (cls === 'dark') document.documentElement.classList.add('dark');
                else if (cls === 'mocha') document.documentElement.classList.add('mocha');
                window.__recurrency_theme = cls;
                // Set loader bg via inline style (authoritative, no cascade)
                var loader = document.getElementById('pre-wasm-loader');
                if (loader) {
                    loader.style.backgroundColor = 'rgba(0,0,0,0.5)';
                }
                // Update meta theme-color
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) {
                    meta.content = cls === 'dark' ? '#020817' : cls === 'mocha' ? '#1e1e2e' : '#ffffff';
                }
            } catch(e) {}
        })();
    </script>
</body>
</html>

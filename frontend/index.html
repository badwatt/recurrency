<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Recurrency — subscription & expense tracker that helps you budget by viewing every cost as an ongoing commitment." />
  <meta property="og:title" content="Recurrency" />
  <meta property="og:description" content="Subscription & expense tracker. Treat every expense like a subscription." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="theme-color" content="#FAF9F2" />
  <style>
    /* Critical FOUC-prevention: hide body until Tailwind loads */
    body { visibility: hidden; }
    html.light body, html.dark body, html.mocha body { visibility: visible; }
    #pre-wasm-loader { display: flex; flex-direction: column; gap: 24px; padding: 32px; max-width: 448px; margin: 0 auto; min-height: 100vh; justify-content: center; font-family: system-ui, -apple-system, sans-serif; }
    .sk { background: #e5e7eb; border-radius: 6px; animation: pulse 1.5s ease-in-out infinite; }
    html.dark .sk, html.mocha .sk { background: #374151; }
    .sk-title { height: 32px; width: 50%; }
    .sk-sub { height: 12px; width: 33%; margin-top: 8px; }
    .sk-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    .sk-row-dot { height: 36px; width: 36px; border-radius: 50%; flex-shrink: 0; }
    .sk-row-lines { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .sk-row-line { height: 10px; }
    .sk-row-val { height: 10px; width: 64px; flex-shrink: 0; }
    .sk-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .sk-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    html.dark .sk-card, html.mocha .sk-card { border-color: #374151; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
  <noscript><style>body{visibility:visible!important}</style></noscript>
  <title>Recurrency</title>
</head>

<body class="hidden"><!-- hidden until theme applied -->
  <div id="pre-wasm-loader">
    <div>
      <div class="sk sk-title"></div>
      <div class="sk sk-sub"></div>
    </div>
    <div class="sk-row">
      <div class="sk sk-row-dot"></div>
      <div class="sk-row-lines">
        <div class="sk sk-row-line" style="width:33%"></div>
        <div class="sk sk-row-line" style="width:25%"></div>
      </div>
      <div class="sk sk-row-val"></div>
    </div>
    <div class="sk-row">
      <div class="sk sk-row-dot"></div>
      <div class="sk-row-lines">
        <div class="sk sk-row-line" style="width:40%"></div>
        <div class="sk sk-row-line" style="width:20%"></div>
      </div>
      <div class="sk sk-row-val"></div>
    </div>
    <div class="sk-row">
      <div class="sk sk-row-dot"></div>
      <div class="sk-row-lines">
        <div class="sk sk-row-line" style="width:30%"></div>
        <div class="sk sk-row-line" style="width:35%"></div>
      </div>
      <div class="sk sk-row-val"></div>
    </div>
    <div class="sk-cards">
      <div class="sk-card">
        <div class="sk" style="height:16px;width:60%"></div>
        <div class="sk" style="height:12px;width:40%"></div>
      </div>
      <div class="sk-card">
        <div class="sk" style="height:16px;width:50%"></div>
        <div class="sk" style="height:12px;width:35%"></div>
      </div>
    </div>
  </div>
  <div id="main"></div>
  <script>
    // Set loader background immediately after body exists.
    // This runs synchronously before any rendering, so inline style
    // overrides the CSS default (no cascade delay).
    (function () {
      try {
        var stored = localStorage.getItem('recurrency-theme');
        var theme = stored || 'system';
        var cls = 'light';
        if (theme === 'dark') cls = 'dark';
        else if (theme === 'mocha') cls = 'mocha';
        else if (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) cls = 'dark';
        // Add theme class to html
        if (cls === 'dark') document.documentElement.classList.add('dark');
        else if (cls === 'mocha') document.documentElement.classList.add('mocha');
        window.__recurrency_theme = cls;
        // Set loader bg via inline style (authoritative, no cascade)
        // Show body once theme is determined
        document.body.classList.remove('hidden');
        // Hide pre-WASM loader once Dioxus renders (uses rAF polling)
        (function() {
            function hideLoader() {
                var loader = document.getElementById('pre-wasm-loader');
                var main = document.getElementById('main');
                if (loader && (main.children.length > 0 || loader.style.display === 'none')) {
                    loader.style.display = 'none';
                    return;
                }
                requestAnimationFrame(hideLoader);
            }
            requestAnimationFrame(hideLoader);
        })();
        // Update meta theme-color
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.content = cls === 'dark' ? '#0d0d11' : cls === 'mocha' ? '#1e1e2e' : '#FAF9F2';
        }
      } catch (e) { }
    })();
  </script>
</body>

</html>

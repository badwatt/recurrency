<!DOCTYPE html>
<html lang="en" class="dark mocha">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Recurrency — subscription & expense tracker that helps you budget by viewing every cost as an ongoing commitment." />
  <meta property="og:title" content="Recurrency" />
  <meta property="og:description" content="Subscription & expense tracker. Treat every expense like a subscription." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="theme-color" content="#1e1e2e" />
  <style>
    /* Critical FOUC-prevention: hide body until Dioxus renders */
    body { visibility: hidden; }
    /* Pre-wasm-loader must be visible during load despite hidden body */
    #pre-wasm-loader { visibility: visible !important; }
    /* Theme backgrounds — matches :root CSS vars for each theme */
    html, #pre-wasm-loader { background-color: #1e1e2e; color: #cdd6f4; }
    html.light, html.light #pre-wasm-loader { background-color: #FAF9F2; color: #212121; }
    html.dark, html.dark #pre-wasm-loader { background-color: #0d0d11; color: #ededed; }
    html.mocha, html.mocha #pre-wasm-loader { background-color: #1e1e2e; color: #cdd6f4; }
    #pre-wasm-loader { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Cabinet Grotesk', system-ui, -apple-system, sans-serif; }
    ._loader-ring { width: 48px; height: 48px; position: relative; }
    .loader-ring track { position: absolute; inset: 0; border-radius: 50%; border: 2px solid #3b4261; }
    .loader-ring arc { position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; border-top-color: #6366f1; animation: loader-spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .loader-ring arc:nth-child(3) { inset: 6px; border-top-color: #818cf8; animation-duration: 1.4s; animation-direction: reverse; }
    @keyframes loader-spin { to { transform: rotate(360deg); } }
    .loader-brand { margin-top: 24px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: #cdd6f4; }
    html.light .loader-brand { color: #212121; }
    .loader-tagline { margin-top: 6px; font-size: 13px; color: #a6adc8; }
    .loader-dots { display: inline-block; }
    .loader-dots span { animation: loader-dot 1.2s infinite; opacity: 0; }
    .loader-dots span:nth-child(1) { animation-delay: 0s; }
    .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes loader-dot { 0%, 60%, 100% { opacity: 0; } 30% { opacity: 1; } }
  </style>
  <noscript><style>body{visibility:visible!important}</style></noscript>

  <script>
    // Safety net: if WASM fails or takes >15s, show body + drop the loader anyway
    setTimeout(function(){
      var p = document.getElementById('pre-wasm-loader');
      if (p) p.remove();
      if(document.body.style.visibility === 'hidden' || getComputedStyle(document.body).visibility === 'hidden') {
        document.body.style.visibility = 'visible';
      }
    }, 15000);
  </script>
  <title>Recurrency</title>
</head>

<body><!-- hidden via inline CSS until Dioxus renders -->
  <div id="pre-wasm-loader">
    <div class="_loader-ring loader-ring">
      <track></track>
      <arc></arc>
      <arc></arc>
    </div>
    <div class="loader-brand">Recurrency</div>
    <div class="loader-tagline">Every expense is a subscription<span class="loader-dots"><span>.</span><span>.</span><span>.</span></span></div>
  </div>
  <div id="main"></div>
  <script>
    // Set theme class on <html> — prevents flash of wrong theme.
    // Mocha is default. Always add 'dark' for Tailwind dark: utilities.
    (function () {
      try {
        var stored = localStorage.getItem('recurrency-theme');
        var theme = stored || 'mocha';
        var cls = 'mocha';
        if (theme === 'dark') cls = 'dark';
        else if (theme === 'light') cls = 'light';
        else if (theme === 'mocha') cls = 'mocha';
        else if (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) cls = 'mocha';
        else if (theme === 'system') cls = 'light';
        var extra = cls === 'light' ? '' : ' dark';
        document.documentElement.className = cls + extra;
        var colors = { light: '#FAF9F2', dark: '#0d0d11', mocha: '#1e1e2e' };
        var color = colors[cls] || colors.mocha;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = color;
        // Android: paint status/navigation bars + icon contrast from the theme.
        try {
          if (window.RecurrencyAndroid && window.RecurrencyAndroid.setSystemBars) {
            window.RecurrencyAndroid.setSystemBars(color, cls === 'light');
          }
        } catch (err) { }
      } catch (e) { }
    })();
  </script>
</body>

</html>

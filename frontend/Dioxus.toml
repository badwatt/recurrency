[application]
name = "Recurrency"
out_dir = "dist"
asset_dir = "assets"
public_dir = "public"

[web.app]
title = "Recurrency"

[web.watcher]
watch_path = ["src", "assets", "public"]

[bundle]
identifier = "com.alvaro17f.recurrency"
icon = ["assets/icon.png"]

[android]
# Only build arm64 (95%+ of Android devices) — skip x86_64 to halve build time
build_targets = ["aarch64-linux-android"]
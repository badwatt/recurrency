[application]
name = "Recurrency"
out_dir = "dist"
asset_dir = "assets"
public_dir = "public"

[web.app]
title = ""

[web.watcher]
watch_path = ["src", "assets", "public"]

[bundle]
identifier = "com.alvaro17f.recurrency"
icon = ["assets/icon.png"]

[android]
# arm64 covers 95%+ of devices; add "x86_64-linux-android" if needed for emulators
build_targets = ["aarch64-linux-android"]
min_sdk_version = 21
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Recurrency</title>
    <link rel="stylesheet" href="/tailwind.css" />
    <style>
        /* Inline theme variables — available before tailwind.css loads.
           Prevents wrong-color flash on refresh in dark/mocha mode. */
        :root {
            --background: 0 0% 100%;
            --foreground: 222.2 84% 4.9%;
            --primary: 222.2 47.4% 11.2%;
            --muted: 210 40% 96.1%;
        }
        .dark {
            --background: 222.2 84% 4.9%;
            --foreground: 210 40% 98%;
            --primary: 210 40% 98%;
            --muted: 217.2 32.6% 17.5%;
        }
        .mocha {
            --background: 240 21% 15%;
            --foreground: 226 64% 88%;
            --primary: 232 97% 85%;
            --muted: 234 13% 31%;
        }
        /* Pre-WASM loading overlay — themed + semi-transparent + backdrop-blur */
        #pre-wasm-loader {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: fixed; inset: 0; z-index: 9999;
            background-color: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: hsl(var(--foreground));
        }
        .dark #pre-wasm-loader { background-color: rgba(2,8,23,0.85); }
        .mocha #pre-wasm-loader { background-color: rgba(30,30,46,0.85); }
        #pre-wasm-loader .rings { position: relative; width: 3rem; height: 3rem; }
        #pre-wasm-loader .r1,
        #pre-wasm-loader .r2 { position: absolute; inset: 0; border-radius: 9999px; border: 4px solid hsl(var(--muted)); }
        #pre-wasm-loader .r1 { border-top-color: hsl(var(--primary)); animation: spin 1s linear infinite; }
        #pre-wasm-loader .r2 { inset: 0.5rem; border-bottom-color: hsl(var(--primary)/.5); animation: spin 1s linear infinite reverse; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #pre-wasm-loader p { font-size: 0.875rem; font-weight: 500; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.5 } }
    </style>
    <script>
        (function() {
            try {
                var stored = localStorage.getItem('recurrency-theme');
                var theme = stored || 'system';
                var cls = 'light';
                if (theme === 'dark') cls = 'dark';
                else if (theme === 'mocha') cls = 'mocha';
                else if (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) cls = 'dark';
                if (cls === 'dark') document.documentElement.classList.add('dark');
                else if (cls === 'mocha') document.documentElement.classList.add('mocha');
                window.__recurrency_theme = cls;
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) {
                    meta.content = cls === 'dark' ? '#020817' : cls === 'mocha' ? '#1e1e2e' : '#ffffff';
                }
            } catch(e) {}
        })();
    </script>
</head>
<body>
    <script>
        // Set body background-color AFTER body exists to prevent white flash.
        // Derives color from CSS variable --background so values always match.
        try {
            var cls = window.__recurrency_theme || 'light';
            // Read computed CSS variable value
            var style = getComputedStyle(document.documentElement);
            var bg = style.getPropertyValue('--background').trim();
            if (bg) {
                document.body.style.backgroundColor = 'hsl(' + bg + ')';
            } else {
                // Fallback hex for very old browsers
                var bgMap = { dark: '#020817', mocha: '#1e1e2e', light: '#ffffff' };
                document.body.style.backgroundColor = bgMap[cls] || '#ffffff';
            }
        } catch(e) {}
    </script>
    <div id="pre-wasm-loader">
        <div class="rings"><div class="r1"></div><div class="r2"></div></div>
        <p>Loading...</p>
    </div>
    <div id="main"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Recurrency</title>
    <link rel="stylesheet" href="/tailwind.css" />
    <script>
        (function() {
            try {
                var stored = localStorage.getItem('recurrency-theme');
                var theme = stored || 'system';
                var cls = 'light';
                if (theme === 'dark') cls = 'dark';
                else if (theme === 'mocha') cls = 'mocha';
                else if (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) cls = 'dark';
                if (cls === 'dark') document.documentElement.classList.add('dark');
                else if (cls === 'mocha') document.documentElement.classList.add('mocha');
                window.__recurrency_theme = cls;
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) {
                    meta.content = cls === 'dark' ? '#030712' : cls === 'mocha' ? '#1e1e2e' : '#ffffff';
                }
            } catch(e) {}
        })();
    </script>
</head>
<body>
    <script>
        // Set body background-color AFTER body exists to prevent white flash.
        // Derives color from CSS variable --background so values always match.
        try {
            var cls = window.__recurrency_theme || 'light';
            // Read computed CSS variable value
            var style = getComputedStyle(document.documentElement);
            var bg = style.getPropertyValue('--background').trim();
            if (bg) {
                document.body.style.backgroundColor = 'hsl(' + bg + ')';
            } else {
                // Fallback hex for very old browsers
                var bgMap = { dark: '#020817', mocha: '#1e1e2e', light: '#ffffff' };
                document.body.style.backgroundColor = bgMap[cls] || '#ffffff';
            }
        } catch(e) {}
    </script>
    <div id="main"></div>
</body>
</html>

name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        id: setup-java
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Cache frontend dependencies
        id: cache-frontend
        uses: actions/cache@v5
        with:
          path: frontend/node_modules
          key: frontend-${{ runner.os }}-${{ hashFiles('frontend/bun.lock*') }}
          restore-keys: frontend-${{ runner.os }}-

      - name: Install frontend dependencies
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        run: cd frontend && bun install --frozen-lockfile

      - name: Type check frontend
        run: cd frontend && bun run typecheck

      - name: Initialize Tauri Android project
        run: cd frontend && bunx tauri android init --ci
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}

      - name: Build APK
        run: cd frontend && bunx tauri android build --apk
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}

      - name: Find APK files
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find frontend/src-tauri/gen/android -name "*.apk" -type f 2>/dev/null || echo "No APKs in gen/android"
          find frontend -name "*.apk" -type f 2>/dev/null || echo "No APKs in frontend"
          echo "=== Listing build outputs ==="
          ls -la frontend/src-tauri/gen/android/app/build/outputs/apk/ 2>/dev/null || echo "No apk output dir"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recurrency-android
          path: frontend/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: frontend/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
name: Android Release

on:
  push:
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Sync version
        run: bash scripts/sync-version.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
          cache-on-failure: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        id: setup-java
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk
          key: android-sdk-${{ runner.os }}

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/src-tauri/gen/android/**/*.gradle*', 'frontend/src-tauri/gen/android/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Cache frontend dependencies
        id: cache-frontend
        uses: actions/cache@v5
        with:
          path: frontend/node_modules
          key: frontend-${{ runner.os }}-${{ hashFiles('frontend/bun.lock*') }}
          restore-keys: frontend-${{ runner.os }}-

      - name: Install frontend dependencies
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        run: cd frontend && bun install --frozen-lockfile

      - name: Initialize Tauri Android project
        run: cd frontend && bunx tauri android init --ci
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}

      - name: Configure Android network security
        run: |
          MANIFEST="frontend/src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Add networkSecurityConfig to application tag (usesCleartextTraffic already exists)
            sed -i 's/<application/<application android:networkSecurityConfig="@xml\/network_security_config"/' "$MANIFEST"
            # Copy network security config
            mkdir -p frontend/src-tauri/gen/android/app/src/main/res/xml
            cp frontend/src-tauri/android-resources/xml/network_security_config.xml frontend/src-tauri/gen/android/app/src/main/res/xml/
          else
            echo "AndroidManifest.xml not found, skipping"
          fi

      - name: Type check frontend
        run: cd frontend && bun run typecheck

      - name: Build APK (debug signed)
        run: cd frontend && bunx tauri android build --apk --debug
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recurrency-android
          path: frontend/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Attach APK to release
        if: always()
        run: |
          VERSION=$(cat VERSION)
          gh release upload "v${VERSION}" frontend/src-tauri/gen/android/app/build/outputs/apk/**/*.apk || echo "Release v${VERSION} not found yet, APK available as artifact"
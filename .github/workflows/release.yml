name: Release

on:
  push:
    paths:
      - "Cargo.toml"
  workflow_dispatch:
    inputs:
      skip_docker:
        description: "Skip docker image build (APK-only run)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  DX_VERSION: "0.7.10"
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  # ── Cleanup: Delete old artifacts to free up storage ─────
  cleanup-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            docker-*
            build-*
          failOnError: false

  # ── Prepare: extract version from workspace Cargo.toml ────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Get version
        id: version
        run: echo "version=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

  # ── Backend: lint + test ──────────────────────────────────
  test-backend:
    needs: prepare
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recurrency
          POSTGRES_PASSWORD: recurrency
          POSTGRES_DB: recurrency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install nightly clippy
        run: rustup component add clippy --toolchain nightly-x86_64-unknown-linux-gnu

      - name: Install system deps (minimal)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev >/dev/null 2>&1

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true
          cache-all-crates: true

      - name: Clippy + test (parallel)
        env:
          DATABASE_URL: postgres://recurrency:recurrency@localhost:5432/recurrency_test
          JWT_SECRET: test-jwt-secret-key
          CARGO_BUILD_JOBS: 4
        run: |
          cd backend
          cargo clippy --lib --jobs 4 -- -D warnings
          cargo test --lib --jobs 4

  # ── Frontend: lint + test ──────────────────────────────────
  test-frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install nightly clippy
        run: rustup component add clippy --toolchain nightly-x86_64-unknown-linux-gnu

      - name: Install system deps (minimal)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev >/dev/null 2>&1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Tailwind CSS
        run: cd frontend && npm ci --silent && npm run build:css

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend
          cache-on-failure: true
          cache-all-crates: true

      - name: Clippy + test (parallel)
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          cd frontend
          cargo clippy --lib --jobs 4 -- -D warnings
          cargo test --lib --jobs 4

  # ─��� Build Docker images + create release ──────────────────
  docker:
    if: ${{ !inputs.skip_docker }}
    needs: [prepare, test-backend, test-frontend]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create VERSION file
        run: echo "${{ needs.prepare.outputs.version }}" > VERSION

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend image ──────────────────────────────────────
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile
          target: backend
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}-backend:latest
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend image ──────────────────────────────────────
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile
          target: frontend
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend:latest
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── All-in-One image ────────────────────────────────────
      - name: Build and push all-in-one image
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile
          target: all-in-one
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          draft: false

  # ── Build Android APK ──────────────────────────────────────
  android:
    needs: [prepare, test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Install system deps (minimal)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev imagemagick >/dev/null 2>&1

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true
          local-cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dx CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DX_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Tailwind CSS
        run: cd frontend && npm ci --silent && npm run build:css

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend
          cache-on-failure: true
          cache-all-crates: true

      - name: Build Android APK (aarch64)
        env:
          CARGO_BUILD_JOBS: 4
          RUST_BACKTRACE: 1
        run: cd frontend && dx bundle --platform android --target aarch64-linux-android --release

      - name: Setup icons and patch Android build
        # Shared patch script: replaces launcher icons, fixes app name in
        # strings.xml, patches Gradle (extractNativeLibs, jvmTarget), and
        # patches RustWebView.kt for FOUC. Same script used by build-android.sh.
        # Run from frontend/ since dx bundle writes to frontend/target/dx/.
        # ICON env is the source PNG; script's defaults point at res/gradle/webview.
        run: |
          set -e
          cd frontend
          ICON="$PWD/assets/icons/clock-1024.png"
          export ICON
          bash ../scripts/patch-android-build.sh

      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          cd frontend

          # gradlew sits at target/dx/.../release/android/app/ (single app)
          # dx 0.7.9 writes build outputs under app/app/build/ (double app)
          APP_DIR="target/dx/recurrency-frontend/release/android/app"
          GRADLE_FILE=$(find "$APP_DIR" -maxdepth 2 -name build.gradle.kts -exec grep -l 'com.android.application' {} \; 2>/dev/null | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE="$APP_DIR/build.gradle.kts"
          fi
          echo "Using Gradle module: $GRADLE_FILE"

          # dx bundle already ran Gradle on the unpatched res; drop its build
          # outputs so the APK is repackaged from the patched resources.
          rm -rf "$APP_DIR/build" "$APP_DIR/app/build"

          KEYSTORE_OK=0
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$APP_DIR/release.jks" 2>/dev/null; then
            KEYSTORE_OK=1
            export ANDROID_KEYSTORE_PATH="$(cd "$APP_DIR" && pwd)/release.jks"
            # Insert the signing config in the module's android block (once).
            if ! grep -q 'signingConfigs' "$GRADLE_FILE"; then
              sed -i '/android {/a\    signingConfigs {\n        create("release") {\n            storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))\n            storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword = System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }' "$GRADLE_FILE"
            fi
            # Attach it to the existing release build type (no duplicate block).
            if ! grep -q 'signingConfig = signingConfigs.getByName("release")' "$GRADLE_FILE"; then
              sed -i '/getByName("release") {/a\            signingConfig = signingConfigs.getByName("release")' "$GRADLE_FILE"
            fi
            (cd "$APP_DIR" && ./gradlew assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease -x lintVitalReportRelease)
          else
            echo "WARNING: no usable keystore; building debug APK"
            (cd "$APP_DIR" && ./gradlew assembleDebug -x lintVitalAnalyzeDebug -x lintVitalDebug -x lintVitalReportDebug)
          fi

          # Guarantee the uploaded APK is signed (Android rejects unsigned APKs).
          APK_REL=$(find "$APP_DIR" -path '*/build/outputs/apk/*' -name '*.apk' -type f 2>/dev/null | head -1)
          if [ -n "$APK_REL" ] && [ "$KEYSTORE_OK" = "1" ]; then
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            APKSIGNER=$(command -v apksigner || find "$SDK" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
            ZIPALIGN=$(command -v zipalign || find "$SDK" -name zipalign -type f 2>/dev/null | sort -V | tail -1)
            if [ -n "$APKSIGNER" ]; then
              if ! "$APKSIGNER" verify "$APK_REL" >/dev/null 2>&1; then
                echo "APK unsigned — signing $APK_REL"
                if [ -n "$ZIPALIGN" ]; then
                  "$ZIPALIGN" -p -f 4 "$APK_REL" "$APK_REL.aligned" && mv "$APK_REL.aligned" "$APK_REL"
                fi
                "$APKSIGNER" sign --ks "$APP_DIR/release.jks" \
                  --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
                  --key-pass "pass:$ANDROID_KEY_PASSWORD" \
                  --ks-key-alias "$ANDROID_KEY_ALIAS" "$APK_REL"
              fi
              "$APKSIGNER" verify "$APK_REL" && echo "APK signature verified"
            else
              echo "WARNING: apksigner not found; cannot verify the APK signature"
            fi
          fi

      - name: Upload APK to Release
        run: |
          APK=$(find frontend/target/dx -name 'app-release.apk' -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find frontend/target/dx . -name '*.apk' -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi
          echo "Using APK: $APK"
          unzip -l "$APK" | grep -i ic_launcher || true
          mkdir -p bin/android
          APK_NAME="recurrency-${{ needs.prepare.outputs.version }}-aarch64.apk"
          cp "$APK" "bin/android/$APK_NAME"
          ls -lh "bin/android/$APK_NAME"

      - name: Release APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          files: bin/android/*.apk

name: Release

on:
  push:
    paths:
      - "VERSION"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_INCREMENTAL: 0
  DX_VERSION: "0.7.5"

permissions:
  contents: write
  packages: write

jobs:
  # ── Prepare: extract version once ─────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

  # ── Backend tests ──────────────────────────────────────────
  test-backend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Sync version
        run: |
          V="${{ needs.prepare.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$V\"/" backend/Cargo.toml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true

      - name: Run backend tests
        run: cd backend && cargo test

  # ── Frontend tests ─────────────────────────────────────────
  test-frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Sync version
        run: |
          V="${{ needs.prepare.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$V\"/" frontend/Cargo.toml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend
          cache-on-failure: true

      - name: Run frontend tests
        run: cd frontend && cargo test

  # ── Build Docker image + create release ──────────────────
  docker:
    needs: [prepare, test-backend, test-frontend]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync version
        run: |
          V="${{ needs.prepare.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$V\"/" frontend/Cargo.toml backend/Cargo.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          draft: false

  # ── Build Android APK ──────────────────────────────────────
  android:
    needs: [prepare, test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync version
        run: |
          V="${{ needs.prepare.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$V\"/" frontend/Cargo.toml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev imagemagick

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          add-to-path: true
          local-cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Cargo (android)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend
          cache-on-failure: true
          prefix-key: android-arm64
          cache-bin: false

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install dx CLI
        run: |
          cargo binstall dioxus-cli --version ${{ env.DX_VERSION }} --no-confirm
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify dx CLI
        run: which dx && dx --version

      - name: Ensure icon exists
        run: |
          if [ ! -f frontend/assets/icon.png ]; then
            convert -size 512x512 xc:#0ea5e9 frontend/assets/icon.png
          fi

      - name: Build Android bundle
        run: cd frontend && dx bundle --platform android --release

      - name: List bundle output
        run: find frontend/dist -type f \( -name '*.aab' -o -name '*.apk' \) | head -10

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: recurrency-android
          path: |-
            frontend/dist/**/*.aab
            frontend/dist/**/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload bundle to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          files: |-
            frontend/dist/**/*.aab
            frontend/dist/**/*.apk
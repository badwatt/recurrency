name: Release

on:
  push:
    paths:
      - "VERSION"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_INCREMENTAL: 0

permissions:
  contents: write
  packages: write

jobs:
  # ── Prepare: extract version once ─────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

  # ── Stage 1: Build & test ─────────────────────────────────
  build-and-test:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync version
        run: |
          V="${{ needs.prepare.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$V\"/" frontend/Cargo.toml backend/Cargo.toml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Cache Cargo (backend)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true

      - name: Cache Cargo (frontend)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend
          cache-on-failure: true

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('frontend/package.json', 'frontend/bun.lockb') }}
          restore-keys: bun-

      - name: Install dx CLI
        run: cargo install dioxus-cli

      - name: Install frontend deps (tailwind)
        run: cd frontend && npm install

      - name: Build Tailwind CSS
        run: cd frontend && npx tailwindcss -i assets/tailwind.src.css -o assets/tailwind.css --minify

      - name: Run backend tests
        run: cd backend && cargo test

      - name: Run frontend tests
        run: cd frontend && cargo test

      - name: Build frontend (web)
        run: cd frontend && dx bundle --platform web --release

  # ── Stage 1b: Build Android APK ───────────────────────────
  build-android:
    needs: [prepare, build-and-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync version
        run: |
          V="${{ needs.prepare.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$V\"/" frontend/Cargo.toml backend/Cargo.toml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev imagemagick

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          add-to-path: true

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: ${{ steps.ndk.outputs.ndk-path }}
          key: ndk-r27-${{ runner.os }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Cargo (frontend)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend
          cache-on-failure: true

      - name: Install dx CLI
        run: cargo install dioxus-cli

      - name: Ensure icon exists
        run: |
          if [ ! -f frontend/assets/icon.png ]; then
            convert -size 512x512 xc:#0ea5e9 frontend/assets/icon.png
          fi

      - name: Build Android APK
        run: cd frontend && dx bundle --platform android --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: recurrency-android
          path: frontend/dist/android/**/*.apk
          retention-days: 30

  # ── Stage 2: Build Docker image ──────────────────────────
  docker:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync version
        run: |
          V="${{ needs.prepare.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$V\"/" frontend/Cargo.toml backend/Cargo.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 3: Create release ──────────────────────────────
  release:
    needs: [build-and-test, build-android, docker]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: recurrency-android
          path: ./artifacts/android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          draft: false
          files: ./artifacts/android/**/*.apk
name: Release

on:
  push:
    paths:
      - "VERSION"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_INCREMENTAL: 0
  DX_VERSION: "0.7.5"

permissions:
  contents: write
  packages: write

jobs:
  # ── Prepare: extract version once ─────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

  # ── Backend tests ──────────────────────────────────────────
  test-backend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Sync version
        run: |
          V="${{ needs.prepare.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$V\"/" backend/Cargo.toml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true

      - name: Run backend tests
        env:
          JWT_SECRET: test-jwt-secret-key
        run: cd backend && cargo test

  # ── Frontend tests ─────────────────────────────────────────
  test-frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Sync version
        run: |
          V="${{ needs.prepare.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$V\"/" frontend/Cargo.toml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Tailwind CSS
        run: cd frontend && npm ci && npm run build:css

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend
          cache-on-failure: true

      - name: Run frontend tests
        run: cd frontend && cargo test

  # ── Build Docker image + create release ──────────────────
  docker:
    needs: [prepare, test-backend, test-frontend]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync version
        run: |
          V="${{ needs.prepare.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$V\"/" frontend/Cargo.toml backend/Cargo.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          draft: false

  # ── Build Android APK ──────────────────────────────────────
  android:
    needs: [prepare, test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync version
        run: |
          V="${{ needs.prepare.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$V\"/" frontend/Cargo.toml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev imagemagick

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          add-to-path: true
          local-cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Cargo (android)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend
          cache-on-failure: true
          prefix-key: android-arm64
          cache-bin: false

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install dx CLI
        run: |
          cargo binstall dioxus-cli --version ${{ env.DX_VERSION }} --no-confirm
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify dx CLI
        run: which dx && dx --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Tailwind CSS
        run: cd frontend && npm ci && npm run build:css

      - name: Ensure icon exists
        run: |
          if [ ! -f frontend/assets/icon.png ]; then
            convert -size 512x512 xc:#0ea5e9 frontend/assets/icon.png
          fi

      # dx bundle auto-detects HOST arch (x86_64 on CI runner) → APK incompatible with ARM phones.
      # Force aarch64-linux-android via --target flag (covers 95%+ devices).
      - name: Build Android APK (aarch64 debug)
        run: cd frontend && dx bundle --platform android --target aarch64-linux-android

      # Dioxus uses generic ic_launcher.webp icons — replace with our app logo
      - name: Replace Android icons with app logo
        run: |
          cd frontend
          RES_DIR=$(find target/dx -name 'ic_launcher.webp' -path '*/mipmap-hdpi/*' -exec dirname {} \; | head -1 | xargs dirname)
          if [ -z "$RES_DIR" ]; then
            echo "Warning: Could not find Android res directory, skipping icon replacement"
            exit 0
          fi
          echo "Found Android res directory: $RES_DIR"
          # Generate mipmap icons from app icon at each density
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            case $dir in
              mipmap-mdpi)     SIZE=48 ;;
              mipmap-hdpi)     SIZE=72 ;;
              mipmap-xhdpi)   SIZE=96 ;;
              mipmap-xxhdpi)  SIZE=144 ;;
              mipmap-xxxhdpi) SIZE=192 ;;
            esac
            TARGET="$RES_DIR/$dir/ic_launcher.webp"
            if [ -f "$TARGET" ]; then
              convert assets/icons/icon-1024.png -resize ${SIZE}x${SIZE} "$TARGET"
              echo "Replaced $TARGET with ${SIZE}x${SIZE} icon"
            fi
          done

      # Fix Dioxus #5251: generated AndroidManifest.xml has extractNativeLibs="false"
      # which prevents native lib extraction → "not compatible with phone" error.
      # Also: Java 8 target obsolete, lint crashes with AGP 8.8+.
      - name: Patch Android build files (Dioxus #5251)
        run: |
          cd frontend
          ANDROID_DIR=$(find target/dx -name 'AndroidManifest.xml' -path '*/app/src/main/*' -exec dirname {} \; | head -1)
          if [ -n "$ANDROID_DIR" ]; then
            APP_DIR=$(dirname $(dirname $(dirname "$ANDROID_DIR")))
            GRADLE_FILE="$APP_DIR/build.gradle.kts"
            MANIFEST="$ANDROID_DIR/AndroidManifest.xml"
            echo "Patching: $MANIFEST"
            echo "Patching: $GRADLE_FILE"
            # Fix 1: Remove extractNativeLibs="false" (should be true or absent)
            sed -i 's/ android:extractNativeLibs="false"//g' "$MANIFEST"
            # Fix 2: Java 8 → 17
            sed -i 's/VERSION_1_8/VERSION_17/g' "$GRADLE_FILE"
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$GRADLE_FILE"
            # Fix 3: Add jniLibs useLegacyPackaging for native libs
            grep -q 'useLegacyPackaging' "$GRADLE_FILE" || sed -i '/android {/a\    packagingOptions { jniLibs { useLegacyPackaging = true } }' "$GRADLE_FILE"
            # Fix 4: Rebuild with patched files, skip lint
            cd "$APP_DIR"
            ./gradlew assembleDebug -x lintVitalAnalyzeDebug -x lintVitalDebug -x lintVitalReportDebug || true
          fi

      - name: Locate APK
        run: |
          echo "Searching for APK..."
          find bin -name '*.apk' -type f 2>/dev/null || true
          APK=$(find bin -name '*.apk' -type f 2>/dev/null | head -1)
          echo "Found APK: $APK"
          mkdir -p bin
          APK_NAME="recurrency-$(cat VERSION)-aarch64.apk"
          cp "$APK" "frontend/dist/$APK_NAME"
          ls -la "frontend/dist/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: recurrency-android
          path: bin/android/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          files: bin/android/*.apk
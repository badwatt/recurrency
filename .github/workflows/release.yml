name: Release

on:
  push:
    paths:
      - "VERSION"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: 0

permissions:
  contents: write
  packages: write

jobs:
  # ── Stage 1: Build & test ─────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync version
        run: |
          V=$(cat VERSION)
          sed -i "s/\"version\": \".*\"/\"version\": \"$V\"/" frontend/package.json frontend/src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$V\"/" frontend/src-tauri/Cargo.toml backend/Cargo.toml

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true

      - name: Cache frontend dependencies
        id: cache-frontend
        uses: actions/cache@v5
        with:
          path: frontend/node_modules
          key: frontend-${{ runner.os }}-${{ hashFiles('frontend/bun.lock*') }}
          restore-keys: frontend-${{ runner.os }}-

      - name: Install frontend dependencies
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        run: cd frontend && bun install --frozen-lockfile

      - name: Type check frontend
        run: cd frontend && bun run typecheck

      - name: Run frontend tests
        run: cd frontend && bun test

      - name: Run backend tests
        run: cd backend && cargo test

  # ── Stage 2: Build Docker image ──────────────────────────
  docker:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync version
        run: |
          V=$(cat VERSION)
          sed -i "s/\"version\": \".*\"/\"version\": \"$V\"/" frontend/package.json frontend/src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$V\"/" frontend/src-tauri/Cargo.toml backend/Cargo.toml

      - name: Get version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 3: Create release ──────────────────────────────
  release:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false

  # ── Stage 4: Build Android APK ───────────────────────────
  build-android:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync version
        run: |
          V=$(cat VERSION)
          sed -i "s/\"version\": \".*\"/\"version\": \"$V\"/" frontend/package.json frontend/src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$V\"/" frontend/src-tauri/Cargo.toml backend/Cargo.toml

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
          cache-on-failure: true

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        id: setup-java
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk
          key: android-sdk-${{ runner.os }}

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/src-tauri/gen/android/**/*.gradle*', 'frontend/src-tauri/gen/android/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Cache frontend dependencies
        id: cache-frontend
        uses: actions/cache@v5
        with:
          path: frontend/node_modules
          key: frontend-${{ runner.os }}-${{ hashFiles('frontend/bun.lock*') }}
          restore-keys: frontend-${{ runner.os }}-

      - name: Install frontend dependencies
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        run: cd frontend && bun install --frozen-lockfile

      - name: Initialize Tauri Android project
        run: cd frontend && bunx tauri android init --ci
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}

      - name: Configure Android
        run: |
          GEN="frontend/src-tauri/gen/android/app/src/main"
          RES="frontend/src-tauri/android-resources"

          # Network security config
          mkdir -p "$GEN/res/xml"
          cp "$RES/xml/network_security_config.xml" "$GEN/res/xml/"
          MANIFEST="$GEN/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's|<application|<application android:networkSecurityConfig="@xml/network_security_config"|' "$MANIFEST"
          fi

          # Custom MainActivity.kt (safe-area injection + enableEdgeToEdge)
          PACKAGE_DIR="$GEN/java/com/alvaro17f/recurrency"
          mkdir -p "$PACKAGE_DIR"
          cp "$RES/MainActivity.kt" "$PACKAGE_DIR/MainActivity.kt"

          # Activity-ktx dependency for enableEdgeToEdge
          GRADLE="$GEN/../build.gradle.kts"
          if [ -f "$GRADLE" ] && ! grep -q 'activity-ktx' "$GRADLE"; then
            sed -i '/dependencies {/a\    implementation("androidx.activity:activity-ktx:1.9.3")' "$GRADLE"
          fi

          # Transparent status/nav bars + edge-to-edge themes (overwrite)
          mkdir -p "$GEN/res/values" "$GEN/res/values-night"
          cp "$RES/res/values/themes.xml" "$GEN/res/values/themes.xml"
          cp "$RES/res/values-night/themes.xml" "$GEN/res/values-night/themes.xml"

          # Custom app icons (overwrite Tauri default mipmaps)
          for DPI in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$GEN/res/$DPI"
            cp "$RES/res/$DPI/"* "$GEN/res/$DPI/"
          done

      - name: Type check frontend
        run: cd frontend && bun run typecheck

      - name: Build APK (debug signed)
        run: cd frontend && bunx tauri android build --apk --debug
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}

      - name: Rename APK
        run: |
          VERSION=$(cat VERSION)
          SRC=$(find frontend/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          mv "$SRC" "recurrency-${VERSION}-arm64.apk"

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat VERSION)
          gh release upload "v${VERSION}" recurrency-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recurrency-android
          path: recurrency-*.apk
          if-no-files-found: warn
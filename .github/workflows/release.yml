name: Release

on:
  push:
    paths:
      - "Cargo.toml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DX_VERSION: "0.7.9"
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  # ── Prepare: extract version from workspace Cargo.toml ────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        id: version
        run: echo "version=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

  # ── Backend: lint + test ──────────────────────────────────
  test-backend:
    needs: prepare
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recurrency
          POSTGRES_PASSWORD: recurrency
          POSTGRES_DB: recurrency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true

      - name: Clippy + test
        env:
          DATABASE_URL: postgres://recurrency:recurrency@localhost:5432/recurrency_test
          JWT_SECRET: test-jwt-secret-key
        run: |
          cd backend
          cargo clippy --lib -- -D warnings
          cargo test --lib

  # ── Frontend: lint + test ──────────────────────────────────
  test-frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Install nightly clippy
        run: rustup component add clippy --toolchain nightly-x86_64-unknown-linux-gnu

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Tailwind CSS
        run: cd frontend && npm ci && npm run build:css

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend
          cache-on-failure: true

      - name: Clippy + test
        run: |
          cd frontend
          cargo clippy --lib -- -D warnings
          cargo test --lib

  # ── Build Docker images + create release ──────────────────
  docker:
    needs: [prepare, test-backend, test-frontend]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend image ──────────────────────────────────────
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile.backend
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}-backend:latest
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend image ──────────────────────────────────────
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile.frontend
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend:latest
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          draft: false

  # ── Build Android APK ──────────────────────────────────────
  android:
    needs: [prepare, test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev imagemagick

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
          add-to-path: true
          local-cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dx CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DX_VERSION }}

      - name: Verify dx CLI
        run: which dx && dx --version

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Tailwind CSS
        run: cd frontend && npm ci && npm run build:css

      - name: Ensure icon exists
        run: |
          if [ ! -f frontend/assets/icon.png ]; then
            convert -size 512x512 xc:#0ea5e9 frontend/assets/icon.png
          fi

      - name: Build Android APK (aarch64 debug)
        run: cd frontend && dx bundle --platform android --target aarch64-linux-android

      - name: Replace Android icons with app logo
        run: |
          cd frontend
          RES_DIR=$(find target/dx -name 'ic_launcher.webp' -path '*/mipmap-hdpi/*' -exec dirname {} \; | head -1 | xargs dirname)
          if [ -z "$RES_DIR" ]; then
            echo "Warning: Could not find Android res directory, skipping icon replacement"
            exit 0
          fi
          echo "Found Android res directory: $RES_DIR"
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            case $dir in
              mipmap-mdpi)     SIZE=48 ;;
              mipmap-hdpi)     SIZE=72 ;;
              mipmap-xhdpi)   SIZE=96 ;;
              mipmap-xxhdpi)  SIZE=144 ;;
              mipmap-xxxhdpi) SIZE=192 ;;
            esac
            TARGET="$RES_DIR/$dir/ic_launcher.webp"
            if [ -f "$TARGET" ]; then
              convert assets/icons/icon-1024.png -resize ${SIZE}x${SIZE} "$TARGET"
              echo "Replaced $TARGET with ${SIZE}x${SIZE} icon"
            fi
          done
          mkdir -p "$RES_DIR/drawable"
          rm -f "$RES_DIR/drawable/ic_launcher_background.xml" 2>/dev/null || true
          rm -f "$RES_DIR/drawable-v24/ic_launcher_foreground.xml" 2>/dev/null || true
          convert assets/icons/icon-1024.png -resize 216x216 -gravity center -extent 432x432 "$RES_DIR/drawable/ic_launcher_foreground.png"
          convert -size 432x432 xc:'#0ea5e9' "$RES_DIR/drawable/ic_launcher_background.png"
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            LAUNCHER_XML="$RES_DIR/$dir/ic_launcher.xml"
            if [ -f "$LAUNCHER_XML" ]; then
              printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' '  <background android:drawable="@drawable/ic_launcher_background"/>' '  <foreground android:drawable="@drawable/ic_launcher_foreground"/>' '</adaptive-icon>' > "$LAUNCHER_XML"
              echo "Replaced $LAUNCHER_XML"
            fi
          done

      - name: Patch Android build files (Dioxus #5251)
        run: |
          cd frontend
          ANDROID_DIR=$(find target/dx -name 'AndroidManifest.xml' -path '*/app/src/main/*' -exec dirname {} \; | head -1)
          if [ -n "$ANDROID_DIR" ]; then
            APP_DIR=$(dirname $(dirname $(dirname "$ANDROID_DIR")))
            GRADLE_FILE="$APP_DIR/build.gradle.kts"
            MANIFEST="$ANDROID_DIR/AndroidManifest.xml"
            sed -i 's/ android:extractNativeLibs="false"//g' "$MANIFEST"
            sed -i 's/VERSION_1_8/VERSION_17/g' "$GRADLE_FILE"
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$GRADLE_FILE"
            grep -q 'useLegacyPackaging' "$GRADLE_FILE" || sed -i '/android {/a\    packagingOptions { jniLibs { useLegacyPackaging = true } }' "$GRADLE_FILE"
            cd "$APP_DIR"
            ./gradlew assembleDebug -x lintVitalAnalyzeDebug -x lintVitalDebug -x lintVitalReportDebug || true
          fi

      - name: Locate APK
        run: |
          echo "Searching for APK..."
          find frontend/target/dx frontend/bin -name '*.apk' -type f 2>/dev/null || true
          APK=$(find frontend/target/dx frontend/bin -name '*.apk' -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name '*.apk' -type f -not -path './bin/android/*' 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "FATAL: No APK found"
            exit 1
          fi
          echo "Found APK: $APK"
          mkdir -p bin/android
          APK_NAME="recurrency-${{ needs.prepare.outputs.version }}-aarch64.apk"
          cp "$APK" "bin/android/$APK_NAME"
          ls -la "bin/android/$APK_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: recurrency-android
          path: bin/android/*.apk
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          files: bin/android/*.apk
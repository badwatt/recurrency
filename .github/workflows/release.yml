name: Release

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DX_VERSION: "0.7.10"
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  # ── Prepare: detect a version increase in the workspace manifest ──
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Detect version bump
        id: version
        shell: bash
        run: |
          set -euo pipefail

          NEW=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ -z "$NEW" ]; then
            echo "::error file=Cargo.toml::No workspace version found"
            exit 1
          fi

          git fetch --tags --force --quiet || true
          LATEST_TAG=$(git tag --list 'v*' | sort -V | tail -n1 || true)
          LATEST_VERSION="${LATEST_TAG#v}"

          CHANGED=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED=true
          elif [ -z "$LATEST_TAG" ]; then
            CHANGED=true
          elif [ "$NEW" != "$LATEST_VERSION" ] \
            && [ "$(printf '%s\n%s\n' "$LATEST_VERSION" "$NEW" | sort -V | tail -n1)" = "$NEW" ]; then
            CHANGED=true
          fi

          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "previous=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Version: ${LATEST_VERSION:-<none>} -> $NEW (release=$CHANGED)" >> "$GITHUB_STEP_SUMMARY"

  # ── Create the release early so builders upload directly ───
  create-release:
    needs: [prepare]
    if: ${{ needs.prepare.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Build the commit changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          PREVIOUS=""
          if [ -n "${{ needs.prepare.outputs.previous }}" ] \
            && git rev-parse -q --verify "refs/tags/v${{ needs.prepare.outputs.previous }}" >/dev/null; then
            PREVIOUS="v${{ needs.prepare.outputs.previous }}"
          else
            PREVIOUS=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null \
              || git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          fi
          if [ "$PREVIOUS" = "$TAG" ]; then
            PREVIOUS=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          fi

          {
            echo "## Commits"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log "$PREVIOUS..HEAD" --pretty=format:"- %s (%h)"
            else
              git log HEAD --pretty=format:"- %s (%h)"
            fi
            echo
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "**Full Changelog**: https://github.com/${GH_REPO}/compare/${PREVIOUS}...${TAG}"
            fi
          } > release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
            echo "Updated release notes for $TAG."
          else
            gh release create "$TAG" --target "$RELEASE_SHA" --title "Recurrency $TAG" --notes-file release-notes.md
            echo "Created release $TAG."
          fi

  # ── Build and push the all-in-one image ────────────────────
  docker:
    if: ${{ needs.prepare.outputs.changed == 'true' }}
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── All-in-One image ────────────────────────────────────
      - name: Build and push all-in-one image
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile
          target: all-in-one
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build Android APK ──────────────────────────────────────
  android:
    needs: [prepare, create-release]
    if: ${{ needs.prepare.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Install system deps (minimal)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev imagemagick >/dev/null 2>&1

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true
          local-cache: true

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install dx CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DX_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Tailwind CSS
        run: cd frontend && npm ci --silent && npm run build:css

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend
          cache-on-failure: true
          cache-all-crates: true

      - name: Build Android APK (aarch64)
        env:
          CARGO_BUILD_JOBS: 4
          RUST_BACKTRACE: 1
        run: cd frontend && dx bundle --platform android --target aarch64-linux-android --release

      - name: Setup icons and patch Android build
        # Uses the same Rust patcher as `cargo build-android`: replaces
        # launcher icons, fixes app name in strings.xml, patches Gradle
        # (extractNativeLibs, jvmTarget) and RustWebView.kt for FOUC.
        run: |
          set -e
          ICON="$PWD/frontend/assets/icons/clock-1024.png" \
            cargo run -p recurrency_tools -- patch-android

      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          cd frontend

          # gradlew sits at target/dx/.../release/android/app/ (single app)
          # dx 0.7.9 writes build outputs under app/app/build/ (double app)
          APP_DIR="target/dx/recurrency_frontend/release/android/app"
          GRADLE_FILE=$(find "$APP_DIR" -maxdepth 2 -name build.gradle.kts -exec grep -l 'com.android.application' {} \; 2>/dev/null | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE="$APP_DIR/build.gradle.kts"
          fi
          echo "Using Gradle module: $GRADLE_FILE"

          # dx bundle already ran Gradle on the unpatched res; drop its build
          # outputs so the APK is repackaged from the patched resources.
          rm -rf "$APP_DIR/build" "$APP_DIR/app/build"

          KEYSTORE_OK=0
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$APP_DIR/release.jks" 2>/dev/null; then
            KEYSTORE_OK=1
            export ANDROID_KEYSTORE_PATH="$(cd "$APP_DIR" && pwd)/release.jks"
            # Insert the signing config in the module's android block (once).
            if ! grep -q 'signingConfigs' "$GRADLE_FILE"; then
              sed -i '/android {/a\    signingConfigs {\n        create("release") {\n            storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))\n            storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword = System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }' "$GRADLE_FILE"
            fi
            # Attach it to the existing release build type (no duplicate block).
            if ! grep -q 'signingConfig = signingConfigs.getByName("release")' "$GRADLE_FILE"; then
              sed -i '/getByName("release") {/a\            signingConfig = signingConfigs.getByName("release")' "$GRADLE_FILE"
            fi
            (cd "$APP_DIR" && ./gradlew assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease -x lintVitalReportRelease)
          else
            echo "WARNING: no usable keystore; building debug APK"
            (cd "$APP_DIR" && ./gradlew assembleDebug -x lintVitalAnalyzeDebug -x lintVitalDebug -x lintVitalReportDebug)
          fi

          # Guarantee the uploaded APK is signed (Android rejects unsigned APKs).
          APK_REL=$(find "$APP_DIR" -path '*/build/outputs/apk/*' -name '*.apk' -type f 2>/dev/null | head -1)
          if [ -n "$APK_REL" ] && [ "$KEYSTORE_OK" = "1" ]; then
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            APKSIGNER=$(command -v apksigner || find "$SDK" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
            ZIPALIGN=$(command -v zipalign || find "$SDK" -name zipalign -type f 2>/dev/null | sort -V | tail -1)
            if [ -n "$APKSIGNER" ]; then
              if [ -n "$ZIPALIGN" ]; then
                "$ZIPALIGN" -p -f 4 "$APK_REL" "$APK_REL.aligned" && mv "$APK_REL.aligned" "$APK_REL"
              fi
              # Sign with v1+v2+v3 so old and new Android versions accept it.
              "$APKSIGNER" sign --ks "$APP_DIR/release.jks" \
                --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
                --key-pass "pass:$ANDROID_KEY_PASSWORD" \
                --ks-key-alias "$ANDROID_KEY_ALIAS" \
                --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
                "$APK_REL"
              "$APKSIGNER" verify --verbose "$APK_REL"
            else
              echo "WARNING: apksigner not found; cannot verify the APK signature"
            fi
          fi

      - name: Prepare APK artifact
        run: |
          APK=$(find frontend/target/dx -name 'app-release.apk' -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find frontend/target/dx . -name '*.apk' -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi
          mkdir -p target/bin/android
          cp "$APK" target/bin/android/recurrency-aarch64.apk
          ls -lh target/bin/android/recurrency-aarch64.apk

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "v${VERSION}" target/bin/android/recurrency-aarch64.apk --clobber

  # ── Desktop bundles ─────────────────────────────────────────
  desktop:
    needs: [prepare, create-release]
    if: ${{ needs.prepare.outputs.changed == 'true' }}
    uses: ./.github/workflows/desktop.yml
    with:
      tag: v${{ needs.prepare.outputs.version }}
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}

  # ── Standalone all-in-one binary ───────────────────────────
  binary:
    needs: [prepare, create-release]
    if: ${{ needs.prepare.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev binaryen >/dev/null 2>&1

      - name: Install dx
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DX_VERSION }}

      - name: Cache PostgreSQL runtime
        uses: actions/cache@v6
        with:
          path: ~/.theseus/postgresql
          key: postgresql-18.7.0-${{ runner.os }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true

      - name: Build all-in-one binary
        env:
          CARGO_BUILD_JOBS: 4
          RUST_BACKTRACE: 1
        run: cargo run -p recurrency_tools -- build-app

      - name: Verify binary
        run: target/bin/recurrency --version

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "v${VERSION}" target/bin/recurrency --clobber


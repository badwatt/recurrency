name: Release

on:
  push:
    paths:
      - "Cargo.toml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DX_VERSION: "0.7.9"
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  # ── Cleanup: Delete old artifacts to free up storage ─────
  cleanup-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            docker-*
            build-*
          failOnError: false

  # ── Prepare: extract version from workspace Cargo.toml ────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Get version
        id: version
        run: echo "version=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

  # ── Backend: lint + test ──────────────────────────────────
  test-backend:
    needs: prepare
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recurrency
          POSTGRES_PASSWORD: recurrency
          POSTGRES_DB: recurrency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install nightly clippy
        run: rustup component add clippy --toolchain nightly-x86_64-unknown-linux-gnu

      - name: Install system deps (minimal)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev >/dev/null 2>&1

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true
          cache-all-crates: true

      - name: Clippy + test (parallel)
        env:
          DATABASE_URL: postgres://recurrency:recurrency@localhost:5432/recurrency_test
          JWT_SECRET: test-jwt-secret-key
          CARGO_BUILD_JOBS: 4
        run: |
          cd backend
          cargo clippy --lib --jobs 4 -- -D warnings
          cargo test --lib --jobs 4

  # ── Frontend: lint + test ──────────────────────────────────
  test-frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install system deps (minimal)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev >/dev/null 2>&1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Tailwind CSS
        run: cd frontend && npm ci --silent && npm run build:css

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend
          cache-on-failure: true
          cache-all-crates: true

      - name: Clippy + test (parallel)
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          cd frontend
          cargo clippy --lib --jobs 4 -- -D warnings
          cargo test --lib --jobs 4

  # ─��� Build Docker images + create release ──────────────────
  docker:
    needs: [prepare, test-backend, test-frontend]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create VERSION file
        run: echo "${{ needs.prepare.outputs.version }}" > VERSION

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend image ──────────────────────────────────────
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile
          target: backend
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}-backend:latest
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend image ──────────────────────────────────────
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile
          target: frontend
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend:latest
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── All-in-One image ────────────────────────────────────
      - name: Build and push all-in-one image
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile
          target: all-in-one
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          draft: false

  # ── Build Android APK ──────────────────────────────────────
  android:
    needs: [prepare, test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Install system deps (minimal)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev imagemagick >/dev/null 2>&1

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true
          local-cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dx CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DX_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Tailwind CSS
        run: cd frontend && npm ci --silent && npm run build:css

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend
          cache-on-failure: true
          cache-all-crates: true

      - name: Build Android APK (aarch64)
        env:
          CARGO_BUILD_JOBS: 4
          RUST_BACKTRACE: 1
        run: cd frontend && dx bundle --platform android --target aarch64-linux-android

      - name: Setup icons and patch Android build
        run: |
          set -e
          cd frontend

          # Find manifest
          MANIFEST=$(find target/dx -name 'AndroidManifest.xml' -path '*/app/src/main/*' 2>/dev/null | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          ANDROID_DIR=$(dirname "$MANIFEST")
          APP_DIR=$(dirname $(dirname $(dirname "$ANDROID_DIR")))
          RES_DIR="$APP_DIR/src/main/res"
          GRADLE_FILE="$APP_DIR/build.gradle.kts"

          # Verify icon exists
          if [ ! -f "assets/icons/icon-1024.png" ]; then
            echo "ERROR: assets/icons/icon-1024.png not found"
            exit 1
          fi

          # Replace icons in one pass (optimized)
          for size_px in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
            size="${size_px%%:*}"
            dpi="${size_px##*:}"
            mkdir -p "$RES_DIR/mipmap-$dpi"
            convert assets/icons/icon-1024.png -resize ${size}x${size} "$RES_DIR/mipmap-$dpi/ic_launcher.png"
          done

          # Patch manifest and gradle
          sed -i 's/ android:extractNativeLibs="false"//g' "$MANIFEST"
          sed -i 's/android:label="recurrency-frontend"/android:label="Recurrency"/g' "$MANIFEST"
          sed -i 's/android:label="RecurrencyFrontend"/android:label="Recurrency"/g' "$MANIFEST"
          sed -i 's/VERSION_1_8/VERSION_17/g' "$GRADLE_FILE"
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$GRADLE_FILE"
          grep -q 'useLegacyPackaging' "$GRADLE_FILE" || sed -i '/android {/a\    packagingOptions { jniLibs { useLegacyPackaging = true } }' "$GRADLE_FILE"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          cd frontend

          APP_DIR=$(find target/dx -name 'AndroidManifest.xml' -path '*/app/src/main/*' -exec dirname {} \; 2>/dev/null | head -1)
          APP_DIR=$(dirname $(dirname $(dirname "$APP_DIR")))
          GRADLE_FILE="$APP_DIR/build.gradle.kts"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$APP_DIR/release.jks" 2>/dev/null || {
              echo "WARNING: Failed to decode keystore, building debug APK"
              cd "$APP_DIR" && ./gradlew assembleDebug -x lintVitalAnalyzeDebug -x lintVitalDebug -x lintVitalReportDebug
              exit 0
            }
            printf '\nandroid.signingConfigs { create("release") { storeFile = file("release.jks"); storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD"); keyAlias = System.getenv("ANDROID_KEY_ALIAS"); keyPassword = System.getenv("ANDROID_KEY_PASSWORD") } }\n' >> "$GRADLE_FILE"
            sed -i '/buildTypes {/a\        release { signingConfig signingConfigs.release }' "$GRADLE_FILE"
            cd "$APP_DIR" && ./gradlew assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease -x lintVitalReportRelease
          else
            cd "$APP_DIR" && ./gradlew assembleDebug -x lintVitalAnalyzeDebug -x lintVitalDebug -x lintVitalReportDebug
          fi

      - name: Upload APK to Release
        run: |
          APK=$(find frontend/target/dx . -name '*.apk' -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi
          mkdir -p bin/android
          APK_NAME="recurrency-${{ needs.prepare.outputs.version }}-aarch64.apk"
          cp "$APK" "bin/android/$APK_NAME"
          ls -lh "bin/android/$APK_NAME"

      - name: Release APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          files: bin/android/*.apk

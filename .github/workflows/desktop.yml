name: Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DX_VERSION: "0.7.10"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Desktop ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev imagemagick >/dev/null 2>&1

      - name: Install dx
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DX_VERSION }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend
          cache-on-failure: true

      - name: Build desktop bundle
        run: cargo build-desktop

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: recurrency-desktop-${{ runner.os }}
          path: target/bin/desktop/*
          if-no-files-found: error

name: Desktop

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "GitHub release tag to upload to"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  DX_VERSION: "0.7.10"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Desktop ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev imagemagick >/dev/null 2>&1

      - name: Install linuxdeploy
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.local/share/.dx/tools"
          curl -L --fail --silent --show-error             -o "$HOME/.local/share/.dx/tools/linuxdeploy-x86_64.AppImage"             https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage
          chmod +x "$HOME/.local/share/.dx/tools/linuxdeploy-x86_64.AppImage"

      - name: Install dx
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DX_VERSION }}

      - name: Add Cargo bin to PATH
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Verify dx
        run: dx --version

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend
          cache-on-failure: true

      - name: Build desktop bundle
        run: cargo build-desktop

      - name: Verify macOS bundle name and signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          APP=$(find frontend/target/dx -type d -name 'Recurrency.app' | head -1)
          test -n "$APP"
          plutil -p "$APP/Contents/Info.plist" | grep -q 'CFBundleName.*Recurrency'
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "Verified $APP"

      - name: Upload desktop bundle artifact (manual runs)
        if: inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: recurrency-desktop-${{ runner.os }}
          path: target/bin/desktop/*
          if-no-files-found: error

      - name: Upload desktop bundle to release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" target/bin/desktop/* --clobber

name: Desktop

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "GitHub release tag to upload to"
        required: false
        type: string
        default: ""
      ref:
        description: "Commit to build"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  DX_VERSION: "0.7.10"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Desktop ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev imagemagick \
            libasound2-dev >/dev/null 2>&1

      - name: Install linuxdeploy
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.local/share/.dx/tools"
          curl -L --fail --silent --show-error             -o "$HOME/.local/share/.dx/tools/linuxdeploy-x86_64.AppImage"             https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage
          chmod +x "$HOME/.local/share/.dx/tools/linuxdeploy-x86_64.AppImage"

      - name: Install dx
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DX_VERSION }}

      - name: Add Cargo bin to PATH
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Verify dx
        run: dx --version

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend
          cache-on-failure: true

      - name: Refresh sherpa-onnx native libs
        shell: bash
        # The prebuilt sherpa archive lives outside Cargo's fingerprint output.
        # A restored target cache can therefore make the linker look for
        # libraries that are not present. Force the build script to fetch them.
        run: |
          cargo clean -p sherpa-onnx-sys || true
          (cd frontend && cargo clean -p sherpa-onnx-sys) || true
          rm -rf target/sherpa-onnx-prebuilt frontend/target/sherpa-onnx-prebuilt

      - name: Build desktop bundle
        run: cargo build-desktop

      - name: Add the macOS microphone usage description
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          DMG=$(find target/bin/desktop -maxdepth 1 -name '*.dmg' | head -1)
          test -n "$DMG"
          MOUNT=$(mktemp -d)
          APP=$(mktemp -d)/Recurrency.app
          STAGING=$(mktemp -d)
          cleanup() {
            hdiutil detach "$MOUNT" >/dev/null 2>&1 || true
            rm -rf "$(dirname "$APP")" "$STAGING"
          }
          trap cleanup EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
          ditto "$MOUNT/Recurrency.app" "$APP"
          hdiutil detach "$MOUNT" >/dev/null
          PLIST="$APP/Contents/Info.plist"
          plutil -replace NSMicrophoneUsageDescription -string "Record voice input for the AI assistant" "$PLIST" 2>/dev/null \
            || plutil -insert NSMicrophoneUsageDescription -string "Record voice input for the AI assistant" "$PLIST"
          codesign --force --deep --sign - "$APP"
          cp -R "$APP" "$STAGING/Recurrency.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname Recurrency -srcfolder "$STAGING" -ov -format UDZO "$DMG" >/dev/null
          codesign --force --sign - "$DMG"

      - name: Verify macOS bundle name and signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          DMG=$(find target/bin/desktop -maxdepth 1 -name '*.dmg' | head -1)
          test -n "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"
          MOUNT=$(mktemp -d)
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
          test -d "$MOUNT/Recurrency.app"
          plutil -p "$MOUNT/Recurrency.app/Contents/Info.plist" | grep -q 'CFBundleName.*Recurrency'
          plutil -p "$MOUNT/Recurrency.app/Contents/Info.plist" | grep -q 'NSMicrophoneUsageDescription'
          codesign --verify --deep --strict --verbose=2 "$MOUNT/Recurrency.app"
          echo "Verified $DMG"

      - name: Upload desktop bundle artifact (manual runs)
        if: inputs.tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: recurrency-desktop-${{ runner.os }}
          path: target/bin/desktop/*
          if-no-files-found: error

      - name: Upload desktop bundle to release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" target/bin/desktop/* --clobber

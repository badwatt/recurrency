services:
  db:
    image: postgres:16-alpine
    container_name: recur-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recur
      POSTGRES_PASSWORD: recur_dev_password
      POSTGRES_DB: recur
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recur -d recur"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
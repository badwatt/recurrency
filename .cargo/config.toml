[alias]
# Local development stack (see tools/src/main.rs).
up = "run -p recurrency_tools -- up"
down = "run -p recurrency_tools -- down"
stop = "run -p recurrency_tools -- stop"
db = "run -p recurrency_tools -- db"
backend = "run -p recurrency_tools -- backend"
frontend = "run -p recurrency_tools -- frontend"
css = "run -p recurrency_tools -- css"
reset = "run -p recurrency_tools -- reset"
coverage = "run -p recurrency_tools -- coverage"
dev-help = "run -p recurrency_tools -- help"

# Build commands (build:app becomes build-app, etc.).
build-all = "run -p recurrency_tools -- build-all"
build-app = "run -p recurrency_tools -- build-app"
build-api = "run -p recurrency_tools -- build-api"
build-web = "run -p recurrency_tools -- build-web"
build-android = "run -p recurrency_tools -- build-android"
setup-android = "run -p recurrency_tools -- setup-android"
patch-android = "run -p recurrency_tools -- patch-android"
build-desktop = "run -p recurrency_tools -- build-desktop"

# Clear commands.
clear = "run -p recurrency_tools -- clear"
clear-app = "run -p recurrency_tools -- clear-app"
clear-api = "run -p recurrency_tools -- clear-api"
clear-web = "run -p recurrency_tools -- clear-web"
clear-android = "run -p recurrency_tools -- clear-android"
clear-desktop = "run -p recurrency_tools -- clear-desktop"
clear-all = "run -p recurrency_tools -- clear-all"

# Workspace-wide checks.
test-all = "test --workspace --lib"
fmt-all = "fmt --all"
clippy-all = "clippy --workspace --lib -- -D warnings"

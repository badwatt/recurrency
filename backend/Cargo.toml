[package]
name = "recurrency-backend"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Recurrency API - Backend for subscription tracker"

[features]
# Integration tests need a running PostgreSQL (docker/docker-compose.dev.yml).
# Run them with: cargo test --features integration-tests
integration-tests = []

[dependencies]
# Web framework
axum = { version = "0.8.9" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "rust_decimal"] }

# Authentication
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
argon2 = "0.5"

# UUID
uuid.workspace = true

# Date/Time
chrono.workspace = true

# Decimal for money
rust_decimal.workspace = true

# Validation
validator = { version = "0.20", features = ["derive"] }

# Error handling
thiserror.workspace = true

# Async traits for hexagonal service ports
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Email
lettre = { version = "0.11.21", default-features = false, features = ["tokio1-native-tls", "smtp-transport", "builder"] }

# HTTP client for logo search
reqwest.workspace = true

# Random (for demo credentials)
rand = "0.10.1"

[dev-dependencies]
serial_test = "3"
tower = { version = "0.5", features = ["util"] }
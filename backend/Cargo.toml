[package]
name = "recurrency-api"
version = "0.0.0"
edition = "2021"
description = "Recurrency API - Backend for subscription tracker"
authors = ["Recurrency Team"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "rust_decimal"] }

# Authentication
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = "0.5"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Decimal for money
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }

# Validation
validator = { version = "0.20", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment
dotenvy = "0.15"

# Email
lettre = { version = "0.11", default-features = false, features = ["tokio1-native-tls", "smtp-transport", "builder"] }

# HTTP client for logo search
reqwest = { version = "0.12", features = ["json"] }
regex = "1"
urlencoding = "2"

# Random (for demo credentials)
rand = "0.10"

[dev-dependencies]
serial_test = "3"

[profile.release]
lto = true
codegen-units = 1

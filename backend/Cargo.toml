[package]
name = "recur-api"
version = "0.1.0"
edition = "2021"
description = "Recur API - Backend for subscription tracker"
authors = ["Recur Team"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "rust_decimal"] }
deadpool-postgres = "0.14"

# Authentication
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = "0.5"
bcrypt = "0.19"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Decimal for money
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }

# Validation
validator = { version = "0.20", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment
dotenvy = "0.15"

# Config
config = "0.15"
rand = "0.10.0"
once_cell = "1.21.4"
native-tls = "0.2.18"
openssl = "0.10.76"
lettre = { version = "0.11.21", default-features = false, features = ["tokio1-native-tls", "smtp-transport", "builder"] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.14"
serial_test = "3"

[profile.release]
lto = true
codegen-units = 1

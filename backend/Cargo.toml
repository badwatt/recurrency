[package]
name = "recurrency-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Recurrency API - Backend for subscription tracker"

[dependencies]
# Web framework
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "rust_decimal"] }

# Authentication
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
argon2 = "0.5"

# UUID
uuid.workspace = true

# Date/Time
chrono.workspace = true

# Decimal for money
rust_decimal.workspace = true

# Validation
validator = { version = "0.20", features = ["derive"] }

# Error handling
thiserror.workspace = true
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
include_dir = { version = "0.7", optional = true }

# Environment
dotenvy = "0.15"

# Email
lettre = { version = "0.11.21", default-features = false, features = ["tokio1-native-tls", "smtp-transport", "builder"] }

# HTTP client for logo search
reqwest.workspace = true
urlencoding = "2"
mime_guess = "2"


# URL-encoded parsing (for OptionalQuery extractor)
serde_urlencoded = "0.7"

# Random (for demo credentials)
rand = "0.10.1"
async-trait = "0.1"

[features]
embed-frontend = ["dep:include_dir"]

[dev-dependencies]
serial_test = "3"
tower = { version = "0.5", features = ["util"] }



[workspace]
resolver = "2"
members = ["backend", "frontend", "tools"]

[workspace.package]
version = "0.27.4"
edition = "2024"
authors = ["badwatt"]

[workspace.dependencies]
# Shared deps between frontend/backend
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "default-tls"] }
thiserror = "2"

# Release profile tuned for runtime speed over compile time.
# `strip = "debuginfo"` (not `true`): with `strip = true`, newer LLVM (23)
# passes --strip-all to wasm-ld, dropping the `__wasm_bindgen_unstable`
# section that wasm-bindgen needs (dioxus#5766).
# `panic = "abort"` is intentionally NOT set: the frontend relies on
# `std::panic::catch_unwind` to contain panics on Android/native.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
opt-level = 3

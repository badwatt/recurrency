[workspace]
resolver = "2"
members = ["backend", "frontend"]

[workspace.package]
version = "0.20.33"
edition = "2024"
authors = ["Recurrency Team"]

[workspace.dependencies]
# Shared deps between frontend/backend
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "default-tls"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
opt-level = 2

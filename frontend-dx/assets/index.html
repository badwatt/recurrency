<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Recurrency</title>
    <link rel="stylesheet" href="/tailwind.css" />
    <style>
        /* Anti-FOUC: apply theme before React hydrates */
        (function() {
            try {
                var stored = localStorage.getItem('recurrency-theme');
                var theme = stored || 'system';
                var class = 'light';
                if (theme === 'dark') class = 'dark';
                else if (theme === 'mocha') class = 'mocha';
                else if (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) class = 'dark';
                document.documentElement.className = class;
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) {
                    meta.content = class === 'dark' ? '#030712' : class === 'mocha' ? '#1e1e2e' : '#ffffff';
                }
            } catch(e) {}
        })();
    </style>
</head>
<body>
    <div id="main"></div>
</body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Recurrency</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <!-- CUSTOM HEAD -->
        <style>
            html { background-color: #1e1e2e; color: #cdd6f4; }
            html.light { background-color: #FAF9F2; color: #212121; }
            html.dark { background-color: #0d0d11; color: #ededed; }
            html.mocha { background-color: #1e1e2e; color: #cdd6f4; }
            body { margin: 0; background-color: inherit; color: inherit; }
            #main { visibility: hidden; }
            .recurrency-loader { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: inherit; color: inherit; font-family: system-ui, -apple-system, sans-serif; }
            .recurrency-spinner { position: relative; width: 48px; height: 48px; }
            .recurrency-spinner::before, .recurrency-spinner::after { content: ""; position: absolute; inset: 0; border: 3px solid rgba(205,214,244,.16); border-top-color: #6366f1; border-radius: 50%; animation: recurrency-spin .9s linear infinite; }
            .recurrency-spinner::after { inset: 7px; border-top-color: transparent; border-bottom-color: #818cf8; animation-duration: 1.4s; animation-direction: reverse; }
            html.light .recurrency-spinner::before, html.light .recurrency-spinner::after { border-color: rgba(33,33,33,.14); border-top-color: #6366f1; }
            html.light .recurrency-spinner::after { border-top-color: transparent; border-bottom-color: #818cf8; }
            .recurrency-brand { margin-top: 24px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
            .recurrency-tagline { margin-top: 6px; font-size: 13px; opacity: .7; }
            .recurrency-dots span { animation: recurrency-dot 1.2s infinite; opacity: 0; }
            .recurrency-dots span:nth-child(2) { animation-delay: .2s; }
            .recurrency-dots span:nth-child(3) { animation-delay: .4s; }
            @keyframes recurrency-spin { to { transform: rotate(360deg); } }
            @keyframes recurrency-dot { 0%, 60%, 100% { opacity: 0; } 30% { opacity: 1; } }
        </style>
    </head>
    <body>
        <div id="recurrency-loader" class="recurrency-loader" role="status" aria-live="polite">
            <div class="recurrency-spinner" aria-hidden="true"></div>
            <div class="recurrency-brand">Recurrency</div>
            <div class="recurrency-tagline">Every expense is a subscription<span class="recurrency-dots"><span>.</span><span>.</span><span>.</span></span></div>
        </div>
        <div id="main"></div>
        <!-- MODULE LOADER -->
    </body>
</html>

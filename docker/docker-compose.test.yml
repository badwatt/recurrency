services:
  db:
    image: postgres:18-alpine
    container_name: recurrency-test-db
    environment:
      POSTGRES_USER: recurrency
      POSTGRES_PASSWORD: recurrency_test_password
      POSTGRES_DB: recurrency_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recurrency -d recurrency_test"]
      interval: 2s
      timeout: 3s
      retries: 10

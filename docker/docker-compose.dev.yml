services:
  db:
    image: postgres:16-alpine
    container_name: recurrency-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recurrency
      POSTGRES_PASSWORD: recurrency_dev_password
      POSTGRES_DB: recurrency
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recurrency -d recurrency"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
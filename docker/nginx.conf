server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Anti-FOUC headers ──────────────────────────────────
    # Preload CSS to prevent flash of unstyled content
    add_header Link "</assets/tailwind.css>; rel=preload; as=style" always;

    # Cache static assets aggressively (JS, CSS, WASM)
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # CORS for WASM
        add_header Access-Control-Allow-Origin "*";
    }

    # WASM files need correct MIME type
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        add_header Access-Control-Allow-Origin "*";
    }

    # ── API proxy to backend ────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Health check proxy
    location /health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # ── SPA fallback ────────────────────────────────────────
    # All other routes serve index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression for text-based assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 256;
}
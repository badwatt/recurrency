services:
  app:
    build: .
    container_name: recurrency
    restart: unless-stopped
    ports:
      - "4000:80"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ENABLE_DEMO: ${ENABLE_DEMO:-true}
      PGPASSWORD: ${PGPASSWORD:-recurrency}
    volumes:
      - recurrency_data:/var/lib/postgresql/15/main

volumes:
  postgres_data:
    driver: local


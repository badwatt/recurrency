# ── All-in-one (recommended) ──────────────────────────────
# Single container with PostgreSQL + backend + frontend:
#
#   docker compose up -d recurrency
#
# Or deploy standalone with:
#   docker run -d -p 80:80 -e JWT_SECRET="$(openssl rand -hex 32)" ghcr.io/badwatt/recurrency:latest
#
services:
  recurrency:
    image: ghcr.io/badwatt/recurrency:latest
    container_name: recurrency
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ENABLE_DEMO: ${ENABLE_DEMO:-false}
      PGPASSWORD: ${PGPASSWORD:-recurrency}
      RUST_LOG: info
    volumes:
      - recurrency_db:/var/lib/postgresql/data


# Recurrency all-in-one: PostgreSQL + a single embedded-web binary.
# There is no nginx and no separate frontend service.
#
#   docker compose up -d recurrency
#
# Web UI: http://localhost
# Backend-only: ENABLE_WEB=false docker compose up -d recurrency
#               API at http://localhost:8080
services:
  recurrency:
    image: ghcr.io/badwatt/recurrency:latest
    container_name: recurrency
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-}
      ENABLE_WEB: ${ENABLE_WEB:-true}
      ENABLE_DEMO: ${ENABLE_DEMO:-false}
      PGPASSWORD: ${PGPASSWORD:-recurrency}
      RUST_LOG: info
    volumes:
      - recurrency_db:/var/lib/postgresql/18/main
      - recurrency_backups:/var/lib/recurrency/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/api/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

volumes:
  recurrency_db:
  recurrency_backups:

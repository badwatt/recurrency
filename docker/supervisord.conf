[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/15/main -c config_file=/etc/postgresql/15/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql-error.log

[program:recur-api]
command=/usr/local/bin/recur-api
environment=DATABASE_URL="postgres://%(ENV_PGUSER)s:%(ENV_PGPASSWORD)s@localhost:5432/%(ENV_PGDATABASE)s",APP_HOST="%(ENV_APP_HOST)s",APP_PORT="%(ENV_APP_PORT)s",JWT_SECRET="%(ENV_JWT_SECRET)s",ENABLE_DEMO="%(ENV_ENABLE_DEMO)s"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/recur-api.log
stderr_logfile=/var/log/supervisor/recur-api-error.log
depends_on=postgresql
startsecs=3

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log
depends_on=recur-api